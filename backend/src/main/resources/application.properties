# Server Configuration
server.port=${PORT:8080}

# Database Configuration - Supabase PostgreSQL (Session Pooler - US East)
# Using session pooler for JPA/Hibernate compatibility
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/medimitra}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Configuration - Optimized for Supabase connection
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=30000
spring.datasource.hikari.register-mbeans=false
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.data.jpa.repositories.bootstrap-mode=default

# JWT Configuration
# For production, always set JWT_SECRET via environment variable.
# Secret must be at least 256 bits (32 characters) for HS256
jwt.secret=${JWT_SECRET:MediMitra-Secret-Key-For-Dev-Environment-2024-Secure}
jwt.expiration=86400000

# Google OAuth Configuration
# Set your Google Client ID from Google Cloud Console
google.client.id=${GOOGLE_CLIENT_ID:}

# CORS Configuration (supports wildcard patterns)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://medi-mitra-omega.vercel.app,https://*.vercel.app}

# Email Configuration (Gmail SMTP)
# For Gmail: 
# 1. Enable 2-Factor Authentication on your Google Account
# 2. Generate an App Password: https://myaccount.google.com/apppasswords
# 3. Use the App Password as MAIL_PASSWORD
# IMPORTANT: For Render/Vercel deployment, use port 465 with SSL instead of 587 with STARTTLS
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=60000
spring.mail.properties.mail.smtp.timeout=60000
spring.mail.properties.mail.smtp.writetimeout=60000
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}

# Logging
logging.level.com.medimitra=${LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL:WARN}
logging.level.com.zaxxer.hikari=INFO
logging.level.org.postgresql=INFO

# Spring DevTools - Disable auto-restart to prevent crashes on network interruptions
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
